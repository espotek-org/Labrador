# Build + package the Unified_App (SDL3/ImGui) Linux artifacts: AppImage and
# .deb for x86_64, arm64 (Raspberry Pi) and i386 (32-bit PCs), each carrying
# the GUI, the headless labrador-cli, the firmware hex, udev rules, icon and
# .desktop entry. Also a Raspberry-Pi GLES2 compile check.
#
# Every arch runs the same recipe, the scripts in Unified_App/packaging/linux/
# (install-build-deps.sh, then build-appimage.sh or build-deb.sh), as root in
# a glibc 2.31 container, so the binaries' glibc floor is 2.31 (Ubuntu 20.04+
# / Debian 11+ / Pi OS bullseye+).  x86_64 and arm64 build in ubuntu:20.04,
# whose wayland 1.18 is SDL3's minimum, so the Wayland backend stays enabled
# (libdecor, not packaged on 20.04, is built from source, and SDL dlopens it
# at runtime like the rest of the Wayland stack).  i386 builds in Debian 11
# (i386/debian:bullseye), which has the same glibc and wayland, because
# Ubuntu 20.04 has no i386 release.  The AppImage binary statically links
# libstdc++/libgcc (so the host's C++ runtime version is irrelevant) and
# libusb; the .deb stays fully dynamic and lets dpkg manage its
# dependencies.
# Reusable (called by qa-release.yml) and directly dispatchable. Uploads
# asset-appimage-<arch> and asset-deb-<arch>.
name: Build Linux

permissions:
  contents: read
  pull-requests: write

on:
  workflow_dispatch:
  workflow_call:

defaults:
  run:
    # Container jobs default to dash, which rejects `set -o pipefail`.
    shell: bash
    working-directory: Unified_App

jobs:
  build-appimage:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x86_64
          - os: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    container: ubuntu:20.04
    steps:
      # actions/checkout needs git inside the container to check out the
      # submodules (and the default working-directory only exists after it).
      - name: Install git
        working-directory: /
        run: |
          apt-get -o Acquire::Retries=3 update
          DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 install -y git ca-certificates

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: packaging/linux/install-build-deps.sh appimage

      - name: Build, check and smoke-test the AppImage
        run: packaging/linux/build-appimage.sh ${{ matrix.arch }} 2.0.${{ github.run_number }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: asset-appimage-${{ matrix.arch }}
          path: Unified_App/Labrador-for-Linux-${{ matrix.arch }}.AppImage
          compression-level: 0
          if-no-files-found: error

  build-deb:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x86_64
          - os: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    container: ubuntu:20.04
    steps:
      - name: Install git
        working-directory: /
        run: |
          apt-get -o Acquire::Retries=3 update
          DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 install -y git ca-certificates

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: packaging/linux/install-build-deps.sh deb

      - name: Build and smoke-test the .deb
        run: packaging/linux/build-deb.sh ${{ matrix.arch }} 2.0.${{ github.run_number }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: asset-deb-${{ matrix.arch }}
          path: Unified_App/Labrador-for-Linux-${{ matrix.arch }}.deb
          compression-level: 0
          if-no-files-found: error

  # Not released: validates the Raspberry Pi 3 (GLES 2.0) renderer keeps compiling.
  build-pi-gles2-check:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          # ports.ubuntu.com has partial outages; retry the whole install.
          ok=""
          for i in 1 2 3; do
            if sudo apt-get -o Acquire::Retries=3 install -y build-essential cmake ninja-build pkg-config \
              libusb-1.0-0-dev libgles2-mesa-dev libgl1-mesa-dev \
              libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev \
              libxi-dev libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev libegl1-mesa-dev \
              libdecor-0-dev libpipewire-0.3-dev libdbus-1-dev; then
              ok=1; break
            fi
            echo "apt-get install failed (attempt $i); retrying"
            sleep 20
            sudo apt-get -o Acquire::Retries=3 update || true
          done
          test -n "$ok"
      - name: Build
        run: |
          cmake --preset pi -DLABRADOR_VERSION=2.0.${{ github.run_number }}
          cmake --build --preset pi
