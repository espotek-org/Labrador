# Build + package the Unified_App (SDL3/ImGui) macOS app: a signed + notarized
# universal (arm64 + x86_64) .app inside a DMG. The headless labrador-cli ships
# inside the bundle as Contents/MacOS/labrador-cli, signed and notarized along
# with the GUI. Floors: macOS 10.13 on Intel (SDL3's minimum and the oldest
# target current Xcode accepts), 11.0 on Apple Silicon. Reusable (called by
# continuous.yml) and directly dispatchable. Uploads asset-dmg.
name: Build macOS

permissions:
  contents: read
  pull-requests: write

on:
  workflow_dispatch:
  workflow_call:

env:
  # NOTE: secrets are only provided in the original repo (empty in forks), which
  # the conditional signing/notarization steps below rely on.
  MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
  MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}

defaults:
  run:
    working-directory: Unified_App

jobs:
  build-dmg:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Dependencies
        run: brew install ninja pkg-config create-dmg

      # Homebrew libusb is single-arch; build a universal static libusb from
      # source so the app is one self-contained universal (arm64 + x86_64)
      # binary with libusb baked in.
      - name: Build universal libusb
        run: |
          set -euxo pipefail
          curl -sSL -o libusb.tar.bz2 \
            https://github.com/libusb/libusb/releases/download/v1.0.29/libusb-1.0.29.tar.bz2
          tar xjf libusb.tar.bz2
          cd libusb-1.0.29
          ./configure --prefix="$PWD/../libusb-univ" --enable-static --disable-shared \
            CFLAGS="-arch arm64 -arch x86_64 -mmacosx-version-min=10.13" \
            LDFLAGS="-arch arm64 -arch x86_64"
          make -j$(sysctl -n hw.ncpu)
          make install
          lipo -info ../libusb-univ/lib/libusb-1.0.a

      - name: Configure
        run: |
          # pkg_check_modules() reads PKG_CONFIG_PATH from the environment, so
          # point it at the universal libusb we just built.
          export PKG_CONFIG_PATH="$PWD/libusb-univ/lib/pkgconfig"
          # 10.13 = SDL3's macOS floor and the oldest target current Xcode
          # accepts; the arm64 slice is clamped to 11.0 automatically (first
          # Apple Silicon macOS).  Keep std::filesystem out of the app - its
          # libc++ symbols need 10.15+ (settings.cpp/paths.cpp use SDL
          # filesystem calls instead).
          cmake -S . -B build/macos -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLABRADOR_STATIC_LIBUSB=ON \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13

      - name: Build
        run: cmake --build build/macos -j$(sysctl -n hw.ncpu)

      - name: Assemble Labrador.app
        run: |
          set -euxo pipefail
          APP=Labrador.app
          rm -rf "$APP"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"

          # Binaries + resources (bundle the firmware hex the librador flashes).
          # labrador-cli goes in beside the GUI: SDL_GetBasePath() inside a
          # bundle is Contents/Resources, so its update-firmware finds the
          # same assets/firmware hex the app uses.
          cp build/macos/labrador "$APP/Contents/MacOS/labrador"
          cp build/macos/cli/labrador-cli "$APP/Contents/MacOS/labrador-cli"
          cp -R assets "$APP/Contents/Resources/assets"
          rm -rf "$APP/Contents/Resources/assets/firmware"
          cp -R firmware "$APP/Contents/Resources/assets/firmware"

          # Icon: ship the same hand-crafted multi-resolution .icns as the old
          # Qt app (Info.plist's CFBundleIconFile already points at "iconfile").
          cp packaging/macos/iconfile.icns "$APP/Contents/Resources/iconfile.icns"

          # Info.plist with the CI version stamped in.
          VER="2.0.${{ github.run_number }}"
          sed -e "s/__SHORT_VERSION__/2.0/" -e "s/__BUNDLE_VERSION__/${VER}/" \
            packaging/macos/Info.plist > "$APP/Contents/Info.plist"

          # libusb is statically linked; the only load commands left should be
          # Apple system libraries and frameworks.  Same floors for both
          # binaries: x86_64 slice 10.13 (High Sierra), arm64 11.0.
          for BIN in "$APP/Contents/MacOS/labrador" "$APP/Contents/MacOS/labrador-cli"; do
            lipo -info "$BIN" | grep -E "arm64.*x86_64|x86_64.*arm64"
            otool -L "$BIN"
            if otool -L "$BIN" | grep -v "^Labrador" | grep -vE "/usr/lib/|/System/Library/"; then
              echo "ERROR: unexpected non-system dynamic dependency in $BIN" >&2
              exit 1
            fi
            otool -arch x86_64 -l "$BIN" | grep -E "minos 10.13|version 10.13"
            otool -arch arm64 -l "$BIN" | grep -E "minos 11.0|version 11.0" | head -1
          done

      # The CLI needs no display, so it can exercise the assembled bundle.
      # update-firmware with no board must get as far as looking for one, which
      # proves it resolved the hex under Contents/Resources/assets/firmware.
      - name: Smoke test labrador-cli in the bundle
        run: |
          set -euxo pipefail
          CLI=Labrador.app/Contents/MacOS/labrador-cli
          "$CLI" --help
          "$CLI" help capture
          "$CLI" help update-firmware
          if "$CLI" update-firmware >cli.log 2>&1; then
            echo "ERROR: update-firmware succeeded with no board attached" >&2
            exit 1
          fi
          cat cli.log
          grep -q "no Labrador board found" cli.log
          # Users are told to symlink it onto PATH; the bundle lookup must
          # still find Contents/Resources through the link.
          mkdir -p "$RUNNER_TEMP/bin"
          ln -sf "$PWD/$CLI" "$RUNNER_TEMP/bin/labrador-cli"
          if PATH="$RUNNER_TEMP/bin:$PATH" labrador-cli update-firmware >cli-link.log 2>&1; then
            echo "ERROR: update-firmware succeeded with no board attached" >&2
            exit 1
          fi
          cat cli-link.log
          grep -q "no Labrador board found" cli-link.log

      - name: Import code signing certificate
        if: env.MACOS_CERTIFICATE != '' && env.MACOS_CERTIFICATE_PWD != ''
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          echo -n "$MACOS_CERTIFICATE" | base64 --decode -o $CERTIFICATE_PATH
          security import $CERTIFICATE_PATH -P "$MACOS_CERTIFICATE_PWD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

      - name: Code sign app bundle
        if: env.MACOS_CERTIFICATE != '' && env.MACOS_CERTIFICATE_PWD != ''
        run: |
          IDENTITY=$(security find-identity -v -p codesigning | grep "Developer ID Application" | head -1 | awk -F'"' '{print $2}')
          echo "Using signing identity: $IDENTITY"
          # Inside out: the helper executable first (notarization requires
          # every Mach-O in the bundle to carry a hardened-runtime signature
          # of its own), then the bundle.
          codesign --force --timestamp --options runtime --sign "$IDENTITY" \
            Labrador.app/Contents/MacOS/labrador-cli
          codesign --force --deep --timestamp --options runtime --sign "$IDENTITY" Labrador.app
          codesign -vv --deep --strict Labrador.app
          codesign -vv --strict Labrador.app/Contents/MacOS/labrador-cli
          codesign -d --verbose=2 Labrador.app/Contents/MacOS/labrador-cli 2>&1 | grep -E "flags=.*runtime"
          echo "App bundle signed successfully"

      - name: Create DMG
        run: |
          set -euxo pipefail
          ARGS=()
          if [ -n "$MACOS_CERTIFICATE" ] && [ -n "$MACOS_CERTIFICATE_PWD" ]; then
            IDENTITY=$(security find-identity -v -p codesigning | grep "Developer ID Application" | head -1 | awk -F'"' '{print $2}')
            ARGS+=(--codesign "$IDENTITY")
          fi
          create-dmg \
            --volname "Labrador" \
            --volicon "Labrador.app/Contents/Resources/iconfile.icns" \
            --background "assets/media/dmg-background.png" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "Labrador.app" 150 200 \
            --hide-extension "Labrador.app" \
            --app-drop-link 450 200 \
            "${ARGS[@]}" \
            "Labrador-for-macOS.dmg" \
            "Labrador.app"

      - name: Notarize DMG
        if: env.MACOS_CERTIFICATE != '' && env.MACOS_CERTIFICATE_PWD != ''
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          DMG_PATH="Labrador-for-macOS.dmg"
          echo "Submitting DMG for notarization..."
          xcrun notarytool submit "$DMG_PATH" \
            --apple-id "$APPLE_ID" --password "$APPLE_ID_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          echo "Stapling notarization ticket..."
          xcrun stapler staple "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"
          spctl -a -vvv -t install "$DMG_PATH"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: asset-dmg
          path: Unified_App/Labrador-for-macOS.dmg
          compression-level: 0
          if-no-files-found: error
